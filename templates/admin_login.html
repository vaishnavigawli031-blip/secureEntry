<!DOCTYPE html>

<html>
<head>
    <title>Admin Login</title>
    <style>
        body{
            font-family: Arial;
            background: linear-gradient(to right,#e6d9ff,#f3ecff);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }


    .login-box{
        background:white;
        padding:30px;
        border-radius:12px;
        box-shadow:0 8px 20px rgba(0,0,0,0.1);
        width:300px;
    }

    h2{
        text-align:center;
        color:#5a2ea6;
    }

    input{
        width:100%;
        padding:10px;
        margin:10px 0;
        border-radius:5px;
        border:1px solid #ccc;
    }

    button{
        width:100%;
        padding:10px;
        background:#7b4ce0;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
    }

    button:hover{
        background:#5a2ea6;
    }
</style>


</head>

<body>

<div class="login-box">
    <h2>Admin Login</h2>


<form action="/admin_login" method="POST">
    <input type="text" name="username" placeholder="Enter Admin Name" required>
    <input type="password" name="password" placeholder="Enter Password" required>
    <button type="submit">Login</button>
</form>


</div>

</body>
</html>
