<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visitor Entry</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:linear-gradient(to right,#e6d9ff,#f3ecff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#fff;
    padding:30px;
    width:420px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#7b4ce0;
}

.form-group{
    margin-bottom:12px;
}

input,textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    transition:0.3s;
}

input:focus, textarea:focus{
    border-color:#7b4ce0;
    box-shadow:0 0 5px rgba(123,76,224,0.3);
}

button{
    padding:10px;
    background:#7b4ce0;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    width:100%;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    background:#5f37c7;
}

video{
    border-radius:10px;
    margin-bottom:10px;
}

img{
    margin-top:10px;
    width:100%;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>Visitor Entry Form</h2>

<form method="POST" action="/confirm">

<div class="form-group">
<input type="text" name="Name" placeholder="Name" required>
</div>

<div class="form-group">
<input type="tel" name="Phone" placeholder="Phone" required>
</div>

<div class="form-group">
<input type="Email" name="Email" placeholder="Email">
</div>

<div class="form-group">
<textarea name="Address" placeholder="Address" required></textarea>
</div>

<div class="form-group">
<input type="text" name="Purpose" placeholder="Purpose" required>
</div>

<div class="form-group">
<input type="Date" name="Date" required>
</div>

<div class="form-group">
<input type="Time" name="Time" required>
</div>

<!-- CAMERA -->
<video id="video" width="100%" height="200" autoplay></video>

<button type="button" onclick="capturePhoto()">Capture Photo</button>

<img id="preview" style="display:none;">
<canvas id="canvas" style="display:none;"></canvas>

<input type="hidden" name="photo_data" id="photo_data">

<br><br>
<button type="submit">Submit</button>

</form>
</div>

<script>

const video = document.getElementById("video");

// start camera
navigator.mediaDevices.getUserMedia({ video:true })
.then(stream => {
    video.srcObject = stream;
})
.catch(err => {
    alert("Camera not working");
});

// compress function (ADDED FIX)
function compressImage(base64, callback){
    const img = new Image();
    img.src = base64;

    img.onload = function(){
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        // reduce size
        canvas.width = 320;
        canvas.height = 240;

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const compressed = canvas.toDataURL("image/jpeg", 0.5);
        callback(compressed);
    };
}

// capture photo
function capturePhoto(){

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video,0,0);

    // ORIGINAL IMAGE (your code kept)
    const image = canvas.toDataURL("image/png");

    // ADDED FIX (compression layer)
    compressImage(image, function(compressedImage){

        document.getElementById("photo_data").value = compressedImage;

        const preview = document.getElementById("preview");
        preview.src = compressedImage;
        preview.style.display = "block";

        alert("Photo Captured Successfully ✅");
    });
}

</script>

</body>
</html>
