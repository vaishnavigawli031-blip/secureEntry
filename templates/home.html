<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALETTERRO | Digital Visitor Entry System</title>

<style>
body{
height:100vh;
margin:0;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial, sans-serif;
background:linear-gradient(to right,#e6d9ff,#f3ecff);
overflow:hidden;
}

/* Glitter dots */
body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background-image:radial-gradient(white 1px, transparent 1px);
background-size:30px 30px;
opacity:0.4;
animation:glitter 6s linear infinite;
}

@keyframes glitter{
0%{transform:translateY(0);}
100%{transform:translateY(-40px);}
}

/* Main box */
.container{
background:white;
padding:30px;
width:320px;
text-align:center;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
position:relative;
z-index:1;
}

/* Title */
.title{
color:#5a2ea6;
font-size:28px;
margin-bottom:5px;
}

/* Subtitle */
.subtitle{
color:#666;
font-size:13px;
margin-bottom:25px;
}

/* Button box */
.button-box{
display:flex;
flex-direction:column;
gap:12px;
}

/* Buttons */
.btn{
text-decoration:none;
padding:10px;
border-radius:6px;
color:white;
font-weight:bold;
position:relative;
overflow:hidden;
transition:0.2s;
}

/* Colors */
.visitor{background-color:#7b4ce0;}
.guard{background-color:#6a5acd;}
.admin{background-color:#5a2ea6;}

/* Shine effect */
.btn::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(255,255,255,0.5),transparent);
transition:0.5s;
}

.btn:hover::before{
left:100%;
}

/* Pop effect */
.btn:hover{
transform:scale(1.05);
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div class="container">
<h1 class="title">ALETTERRO</h1>
<p class="subtitle">Digital Visitor Entry System</p>

<div class="button-box">
<a href="{{ url_for('visitor') }}" class="btn visitor">Visitor</a>
<a href="{{ url_for('guard_login') }}" class="btn guard">Guard Login</a>
<a href="{{ url_for('admin_login') }}" class="btn admin">Admin</a>
</div>

</div>

</body>
</html>
