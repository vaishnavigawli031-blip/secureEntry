<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Confirmation</title>
<style>
body{font-family:Arial;background:linear-gradient(to right,#e6d9ff,#f3ecff);display:flex;justify-content:center;align-items:center;height:100vh;}
.container{background:#fff;padding:30px;width:420px;border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,0.1);}
h2{text-align:center;color:#7b4ce0;margin-bottom:20px;}
p{margin:6px 0;font-size:14px;}
.done-btn{display:block;text-align:center;margin-top:20px;padding:10px;background:#7b4ce0;color:white;text-decoration:none;border-radius:8px;font-weight:bold;}
.done-btn:hover{background:#5f37c7;}
</style>
</head>
<body>
<div class="container">
<h2>Visitor Confirmed ✅</h2>

<p><b>Name:</b> {{ visitor.full_name }}</p>
<p><b>Phone:</b> {{ visitor.phone_no }}</p>
<p><b>Email:</b> {{ visitor.email }}</p>
<p><b>Address:</b> {{ visitor.address }}</p>
<p><b>Purpose:</b> {{ visitor.purpose }}</p>
<p><b>Date:</b> {{ visitor.visit_date }}</p>
<p><b>Time:</b> {{ visitor.visit_time }}</p>

{% if visitor.photo %}
<img src="{{ url_for('static', filename='photos/' + visitor.photo) }}" style="width:150px; height:auto;">
{% endif %}

<a href="{{ url_for('home') }}" class="done-btn">Done</a>
</div>
</body>
</html>
