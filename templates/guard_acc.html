<!DOCTYPE html>
<html>
<head>
<title>Guard Registration</title>
<style>
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f3ecff;
    font-family:Arial;
}
.box{
    background:white;
    padding:40px;
    width:350px;
    border-radius:10px;
    text-align:center;
}
input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
}
.btn{
    background:#7b4ce0;
    color:white;
    padding:10px;
    display:block;
    text-decoration:none;
    margin-top:10px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    width:100%;
    font-weight:bold;
}
.btn:hover{opacity:0.85;}
</style>
</head>
<body>
<div class="box">
<h2>Create Guard Account</h2>
<form method="POST" action="{{ url_for('guard_register_action') }}">
    <input type="text" name="name" placeholder="Guard Name" required>
    <input type="text" name="aadhaar" placeholder="Aadhaar Number" required>
    <input type="text" name="mobile" placeholder="Mobile Number" required>
    <input type="text" name="address" placeholder="Address" required>
    <input type="text" name="guard_id" placeholder="Guard ID" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" class="btn">Register</button>
</form>
</div>
</body>
</html>
